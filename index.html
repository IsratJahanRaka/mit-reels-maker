<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MIT Reels Maker - Professional Bengali Reels & Video Compositor. Create stunning videos with custom frames and text." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.maateen.me" crossorigin />

    <title>MIT Reels Maker</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Loading Screen -->
    <div id="loader-wrapper" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease-out;">
      <div style="text-align: center;">
        <img src="/logo.png" style="width: 80px; height: 80px; margin-bottom: 20px; animation: pulse 2s infinite ease-in-out;" />
        <div style="color: white; font-family: sans-serif; font-weight: bold; letter-spacing: 2px;">MIT REELS MAKER</div>
        <div style="color: #60a5fa; font-size: 12px; margin-top: 10px;">Optimizing Experience...</div>
      </div>
    </div>
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
      }
      .loader-hidden { opacity: 0; pointer-events: none; }
    </style>
    <script type="module">
      window.addEventListener('load', () => {
        const loader = document.getElementById('loader-wrapper');
        setTimeout(() => {
          loader.classList.add('loader-hidden');
        }, 500);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
